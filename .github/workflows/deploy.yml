# Managed by ngx-workshop CLI.
name: Deploy mfe-user-journey-admin-ai-publisher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfe-user-journey-admin-ai-publisher-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false

      - name: Validate frontend deployment settings
        env:
          MFE_DROPLET_IP: ${{ secrets.MFE_DROPLET_IP }}
          MFE_SSH_PRIVATE_KEY: ${{ secrets.MFE_SSH_PRIVATE_KEY }}
          MFE_SSH_HOST_FINGERPRINT: ${{ secrets.MFE_SSH_HOST_FINGERPRINT }}
        run: |
          test -n "$MFE_DROPLET_IP" || { echo "Missing MFE_DROPLET_IP" >&2; exit 1; }
          test -n "$MFE_SSH_PRIVATE_KEY" || { echo "Missing MFE_SSH_PRIVATE_KEY" >&2; exit 1; }
          if [[ ! "$MFE_SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "MFE_SSH_HOST_FINGERPRINT must contain only the frontend host's SHA256 fingerprint" >&2
            exit 1
          fi

      - name: Install dependencies and build
        run: |
          npm ci
          npm run check:architecture
          npm test -- --watch=false --browsers=ChromeHeadless
          npm run build -- --configuration production
          test -f dist/mfe-user-journey-admin-ai-publisher/index.html

      - name: Prepare isolated static deployment
        run: |
          set -eu
          mkdir -p .frontend-deploy/site
          cp -R 'dist/mfe-user-journey-admin-ai-publisher/.' .frontend-deploy/site/
          cp scripts/deploy-static.sh .frontend-deploy/
          test -s .frontend-deploy/site/index.html
          test -s .frontend-deploy/site/remoteEntry.js

      - name: Upload complete build to staging
        id: upload
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          version: '1.8.0'
          host: ${{ secrets.MFE_DROPLET_IP }}
          username: root
          key: ${{ secrets.MFE_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.MFE_SSH_HOST_FINGERPRINT }}
          source: '.frontend-deploy/*'
          target: '/opt/ngx-frontend-staging/mfe-user-journey-admin-ai-publisher/${{ github.run_id }}-${{ github.run_attempt }}'
          strip_components: 1
          overwrite: true

      - name: Promote validated build and remove obsolete assets
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.MFE_DROPLET_IP }}
          username: root
          key: ${{ secrets.MFE_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.MFE_SSH_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: |
            set -eu
            sh '/opt/ngx-frontend-staging/mfe-user-journey-admin-ai-publisher/${{ github.run_id }}-${{ github.run_attempt }}/deploy-static.sh' '${{ github.run_id }}-${{ github.run_attempt }}'

      - name: Clean upload staging
        if: always() && steps.upload.outcome != 'skipped'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.MFE_DROPLET_IP }}
          username: root
          key: ${{ secrets.MFE_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.MFE_SSH_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -eu
            staging='/opt/ngx-frontend-staging/mfe-user-journey-admin-ai-publisher/${{ github.run_id }}-${{ github.run_attempt }}'
            if [ ! -d "$staging/previous" ]; then rm -rf -- "$staging"; fi
